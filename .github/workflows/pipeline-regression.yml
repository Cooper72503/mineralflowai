name: Decision pipeline regression
on:
  pull_request:
  push:
    branches: [main, 'audit/**']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm test
        working-directory: worker
      - run: npm run build
        working-directory: worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/gold2-review-requirements.txt
        working-directory: frontend
      - run: npm run gold2:benchmark
        working-directory: frontend
